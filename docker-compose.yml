services:
  db:
    image: postgis/postgis:17-3.5
    container_name: pi-sentinel-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel_pass}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-sentinel_user} -d ${POSTGRES_DB:-sentinel_db}",
        ]
      interval: 2s
      timeout: 5s
      retries: 5
    networks:
      - sentinel-rat-net

  # One-shot service that creates the database schema and seeds reference data
  # before the pipeline or dashboard start. It reuses the dashboard image (which
  # is built from the dashboard source and carries the authoritative data
  # model), so the schema matches what the dashboard reads. The pipeline runtime
  # installs the dashboard ORM from git@main, which might be a subset of this model,
  # so the same schema also works for the pipeline. Runs init_db, then
  # seed_db.py (mounted from this repo), using the image's Python 3.13, and
  # exits.
  db-init:
    build:
      context: ../sentinel-rat-dashboard
      dockerfile: Dockerfile
    image: sentinel-rat-dashboard:local
    container_name: db-init
    command:
      [
        "sh",
        "-c",
        "/opt/py313/bin/python -m dashboard.init_db && /opt/py313/bin/python /seed/seed_db.py",
      ]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./seed_db.py:/seed/seed_db.py:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - sentinel-rat-net

  sentinel-rat-ml-pipeline:
    build:
      context: ../sentinel-rat-ml-pipeline
      dockerfile: Dockerfile
    container_name: ml-pipeline
    ports:
      - "${ML_PIPELINE_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c ''import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=2)'' || exit 1',
        ]
      interval: 5s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - sentinel-rat-net

  sentinel-rat-pipeline:
    build:
      context: ../sentinel-rat-pipeline
      dockerfile: Dockerfile
    image: sentinel-rat-pipeline:local
    container_name: pipeline
    ports:
      - "${PIPELINE_PORT:-8001}:8001"
    volumes:
      - ${WATCH_FOLDER_HOST:-../watched-images}:${WATCH_FOLDER_DOCKER:-/data/images}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      WATCH_FOLDER_DOCKER: ${WATCH_FOLDER_DOCKER:-/data/images}
      ML_PIPELINE_URL: http://sentinel-rat-ml-pipeline:${ML_PIPELINE_PORT:-8000}
      BATCH_WINDOW_SECONDS: ${BATCH_WINDOW_SECONDS:-60}
      MAX_BATCH_SIZE: ${MAX_BATCH_SIZE:-50}
      PROCESS_BACKLOG: ${PROCESS_BACKLOG:-true}
      FORCE_DELETE_IMAGE_IN_DB: ${FORCE_DELETE_IMAGE_IN_DB:-false}
    depends_on:
      sentinel-rat-ml-pipeline:
        condition: service_healthy
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - sentinel-rat-net

  # Scheduler of the daily analysis: aggregates the detections of each past day
  # into daily_analysis_result every night at ANALYSIS_TIME (in ANALYSIS_TZ),
  # and once at startup to catch up on days missed while it was not running.
  # It reuses the pipeline image. To run it once by hand instead:
  #   docker compose run --rm daily-analysis --once
  #   docker compose run --rm daily-analysis --date 2026-10-01 --recompute
  daily-analysis:
    image: sentinel-rat-pipeline:local
    container_name: daily-analysis
    entrypoint: ["python", "-m", "sentinel_rat_pipeline.daily_analysis"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ANALYSIS_TZ: ${ANALYSIS_TZ:-Asia/Colombo}
      ANALYSIS_TIME: ${ANALYSIS_TIME:-00:00}
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - sentinel-rat-net

  sentinel-rat-dashboard:
    build:
      context: ../sentinel-rat-dashboard
      dockerfile: Dockerfile
    image: sentinel-rat-dashboard:local
    container_name: dashboard
    ports:
      - "${DASHBOARD_PORT:-8501}:3838"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      # corrections rebuild the daily analysis of their day, in the same timezone
      ANALYSIS_TZ: ${ANALYSIS_TZ:-Asia/Colombo}
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - sentinel-rat-net

  # Optional one-shot service that loads illustrative SAMPLE/DEMO data. It only
  # runs when the "demo" profile is enabled, so a normal `docker compose up`
  # ignores it and never loads demo data into a real deployment:
  #   docker compose --profile demo up load-sample-data
  # It reuses the dashboard image (same data model as db-init) and runs after
  # db-init so the schema and seed data (cameras, taxonomy) already exist.
  load-sample-data:
    image: sentinel-rat-dashboard:local
    profiles: ["demo"]
    container_name: load-sample-data
    command: ["/opt/py313/bin/python", "/seed/sample_data.py"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./sample_data.py:/seed/sample_data.py:ro
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - sentinel-rat-net

volumes:
  db-data:

networks:
  sentinel-rat-net:
    driver: bridge
